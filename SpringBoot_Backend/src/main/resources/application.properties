spring.application.name=SpringBoot_Backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pms}
spring.data.mongodb.auto-index-creation=true
jwt.secret=${JWT_SECRET:my-default-secret-key-for-development-which-is-very-long-and-secure}
