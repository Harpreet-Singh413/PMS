spring.application.name=SpringBoot_Backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pms}
spring.data.mongodb.auto-index-creation=true
jwt.secret=${JWT_SECRET:my-default-secret-key-for-development-which-is-very-long-and-secure}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_secret}
